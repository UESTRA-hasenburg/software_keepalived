---
# defaults file for software_keepalive

# Folder for nftables rules
software_keepalived_nftables_rules_folder: /etc/nftables.d

# List of VRRP instances
software_keepalived_vrrp_instances:
  - name: "{{ software_keepalived_vrrp_name | default('VI_1') }}"
    id: "{{ software_keepalived_vrrp_id }}"
    priority: "{{ software_keepalived_vrrp_priority | default(100) }}"
    state: "{{ software_keepalived_vrrp_state | default('BACKUP') }}"
    virtual_ip: "{{ software_keepalived_vrrp_virtual_ip }}"
